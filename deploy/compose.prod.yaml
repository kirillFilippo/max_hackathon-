# Продакшн-стек домашнего узла: PostgreSQL + бот (один HTTP-порт на вебхук и мини-приложение).
#
# Запуск:  cd /opt/dosug-bot && docker compose -f deploy/compose.prod.yaml --env-file .env up -d --build
# Обновление: docker compose -f deploy/compose.prod.yaml pull && docker compose -f deploy/compose.prod.yaml up -d
#
# Наружу порт не публикуется: его забирает обратный SSH-туннель на VPS (127.0.0.1:8090),
# откуда трафик идёт в Cloudflare (minimax.zmeyka.dev).
name: dosug

services:
  postgres:
    image: postgres:16-alpine
    container_name: dosug-postgres
    environment:
      # Токен бота: можно передать переменной окружения
      # (BOT_TOKEN=<токен> docker compose up --build) или положить в .env —
      # compose подставит его сам, отдельный файл не обязателен.
      BOT_TOKEN: ${BOT_TOKEN:-}
      POSTGRES_USER: ${POSTGRES_USER:-dosug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dosug}
      POSTGRES_DB: ${POSTGRES_DB:-dosug}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosug} -d ${POSTGRES_DB:-dosug}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Ограничения под ноут: Postgres здесь ест больше всего, но 1 ГБ ему достаточно.
    mem_limit: 1g
    shm_size: 128m
    restart: unless-stopped

  bot:
    # Локально собираем сами, в CI — тянем готовый образ из GHCR (BOT_IMAGE в .env).
    image: ${BOT_IMAGE:-dosug-bot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dosug-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      # Внутри compose база доступна по имени сервиса.
      # Значения по умолчанию — чтобы файл был самодостаточным: реальные
      # параметры базы всё равно приходят из ../.env.
      DATABASE_URL: postgres://${POSTGRES_USER:-dosug}:${POSTGRES_PASSWORD:-dosug}@postgres:5432/${POSTGRES_DB:-dosug}
      MINIAPP_PORT: "8090"
      # Сертификат MAX (Russian Trusted Root CA) уже внутри образа:
      # NODE_EXTRA_CA_CERTS задан в Dockerfile, монтировать ничего не нужно.
    # DNS внутри контейнера: публичные резолверы из домашней сети периодически
    # не отвечают (в логах — EAI_AGAIN), поэтому первым идёт роутер, вторым —
    # публичный адрес на случай, если роутер недоступен.
    dns:
      - ${DNS_PRIMARY:-192.168.0.1}
      - ${DNS_SECONDARY:-1.1.1.1}
    volumes:
      - ../data:/app/data
    ports:
      # Только локально: туннель ходит на 127.0.0.1:8090.
      - "127.0.0.1:8090:8090"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  dbdata:
