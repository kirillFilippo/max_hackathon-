# Запуск всего локального окружения одной командой:
#   cp .env.example .env   # и укажите BOT_TOKEN
#   docker compose up --build
#
# Данные бота лежат в PostgreSQL на volume pgdata, поэтому переживают
# перезапуск контейнеров, пересборку образа и обновление кода.
services:
  postgres:
    image: postgres:16-alpine
    container_name: max-dosug-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dosug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dosug}
      POSTGRES_DB: ${POSTGRES_DB:-dosug}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Резервная копия: docker compose exec postgres pg_dump -U dosug dosug > dump.sql
    ports:
      # Нужен только для подключения к базе с хоста (например, из psql).
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosug} -d ${POSTGRES_DB:-dosug}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: max-dosug-bot:latest
    container_name: max-dosug-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # .env не обязателен: без него бот поднимется, но BOT_TOKEN нужно передать
      # переменной окружения (BOT_TOKEN=... docker compose up --build).
      - path: .env
        required: false
    environment:
      # Внутри compose база доступна по имени сервиса.
      DATABASE_URL: postgres://${POSTGRES_USER:-dosug}:${POSTGRES_PASSWORD:-dosug}@postgres:5432/${POSTGRES_DB:-dosug}
    # DNS внутри контейнера: публичные резолверы из домашней сети периодически
    # не отвечают (в логах — EAI_AGAIN), поэтому первым идёт роутер, вторым —
    # публичный адрес на случай, если роутер недоступен.
    dns:
      - ${DNS_PRIMARY:-192.168.0.1}
      - ${DNS_SECONDARY:-1.1.1.1}
    volumes:
      # Снимок данных, созданных пока база была недоступна: переживает
      # пересоздание контейнера и уезжает в PostgreSQL после восстановления связи.
      - offline:/app/data
    ports:
      # Нужен только для BOT_MODE=webhook (long polling портов не требует).
      - "${WEBHOOK_PORT:-8080}:8080"
      # Мини-приложение: конструктор вопросов и анкета участника.
      # Работает, если задан MINIAPP_URL (публичный HTTPS), и этот же адрес
      # указан в настройках бота на business.max.ru.
      - "${MINIAPP_PORT:-8090}:8090"
    restart: unless-stopped

volumes:
  pgdata:
  offline:
